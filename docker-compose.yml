services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: hms_pro
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # N-001/N-023: one-shot release phase (preflight -> LGD import -> index
  # migration 011 -> verify). web and worker start only after it exits 0.
  release:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment: &backend-env
      MONGO_URI: mongodb://mongo:27017/hms_pro
      STORAGE_LOCAL_ROOT: /app/backend/storage
      STORAGE_LOCAL_PERSISTENT: "true"
    command: ["node", "backend/scripts/release.mjs"]
    volumes:
      - backend-storage:/app/backend/storage
    healthcheck:
      disable: true

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      release:
        condition: service_completed_successfully
    env_file:
      - ./backend/.env
    environment:
      <<: *backend-env
      PORT: 5000
      SERVICE_ROLE: web          # never runs the scheduler
    ports:
      - "5000:5000"
    volumes:
      - backend-storage:/app/backend/storage
    # Image HEALTHCHECK probes /api/health/ready (DB + required indexes).

  # N-002: exactly ONE worker owns the financial scheduler. Extra replicas would
  # still be safe (CronRunLog lease), but there is no reason to run more.
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      release:
        condition: service_completed_successfully
    env_file:
      - ./backend/.env
    environment:
      <<: *backend-env
      SERVICE_ROLE: worker
    command: ["node", "backend/worker.js"]
    volumes:
      - backend-storage:/app/backend/storage
    healthcheck:
      disable: true            # no HTTP port; liveness = process + CronRunLog heartbeats

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  mongo-data:
  backend-storage:
